[project]
name = "clouddesk"
version = "0.1.0"
description = "CloudDesk AI: an AI-powered customer support and ticket investigation platform built on FastAPI and LangGraph."
readme = "README.md"
authors = [{ name = "Mahesh Kumar", email = "aiwithemkay@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "rag", "langgraph", "fastapi"]
# Each task in TASKS.md adds the packages it introduces (for example pydantic-settings in P1-1,
# SQLAlchemy in P2-1, qdrant-client in P5-2). Vectors are Qdrant and the console is Next.js, so
# chromadb and streamlit are not part of this design.
# langchain, langchain-openai and langgraph are installed up front because Phase 10 builds on them; nothing
# imports them yet (P10-1 adds langgraph-checkpoint-sqlite with the checkpointer). `openai` is imported lazily
# in backend/app/core/llm.py for the OpenAI-compatible providers, which include Euron's euri endpoint, so that
# provider, the planned LLM router and the planned euri embeddings provider need no extra package.
# python-dotenv is not imported directly: pydantic-settings reads .env itself.
dependencies = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.26",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.7",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.4",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.54.0",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "mcp>=2.3.0",
]

# A service run with uvicorn, not a library: nothing to build or install.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ holds the `app` package; the repo root holds agents/, rag/, memory/ and integrations/.
pythonpath = ["backend", "."]
# Async tests need no marker, and all of them share one event loop for the whole session.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]
# ruff also formats code blocks inside markdown, which would rewrite CLAUDE.md and the upstream design
# documents. Markdown is not ours to format.
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
