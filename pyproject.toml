[project]
name = "clouddesk"
version = "0.1.0"
description = "CloudDesk: an autonomous customer-support and resolution platform built on FastAPI and LangGraph."
readme = "README.md"
authors = [{ name = "Mahesh Kumar", email = "aiwithemkay@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "rag", "langgraph", "fastapi"]
# Phase 1 only. Each later phase adds the packages it introduces (see PLAN_PHASE.md).
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# A service run with uvicorn, not a library: nothing to build or install.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ holds the `app` package; the repo root holds agents/, rag/, memory/ (later phases).
pythonpath = ["backend", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
