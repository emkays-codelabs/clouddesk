[project]
name = "clouddesk"
version = "0.1.0"
description = "CloudDesk: an autonomous customer-support and resolution platform built on FastAPI and LangGraph."
readme = "README.md"
authors = [{ name = "Mahesh Kumar", email = "aiwithemkay@gmail.com" }]
requires-python = ">=3.12"
keywords = ["ai", "agents", "rag", "langgraph", "fastapi"]
# Each task in TASKS.md adds the packages it introduces (for example pydantic-settings in P1-1,
# SQLAlchemy in P2-1, qdrant-client in P5-2). Vectors are Qdrant and the console is Next.js, so
# chromadb and streamlit are not part of this design.
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "openai>=3.42.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

# A service run with uvicorn, not a library: nothing to build or install.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
