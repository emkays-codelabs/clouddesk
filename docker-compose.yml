# CloudDesk local stack: frontend -> backend -> redis, qdrant.
#   docker compose up --build
# Image tags are pinned by tag only: pin by digest before production.
# Built and brought up once on 2026-11-27 (all four services healthy, real Redis); see MEMORY.md.
# Host ports: BACKEND_PORT (default 8000) and FRONTEND_PORT (default 3000) pick the host side of each
# mapping when a port is busy, e.g. BACKEND_PORT=18000 FRONTEND_PORT=13000 docker compose up --build.
# They are compose-only variables: Settings does not read them. The frontend image inlines the API
# port at build time, so rebuild it after changing BACKEND_PORT.
# Secrets come from the environment or an optional .env (git-ignored); nothing secret is written here.
name: clouddesk

services:
  redis:
    image: redis:7-alpine # pin by digest before production
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4 # pin by digest before production
    volumes:
      - qdrant-storage:/qdrant/storage
    # The image has no curl or wget, so probe the port with bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: . # the repo root, so rag/, agents/, memory/, integrations/, sample_data/ and database/ are in the context
      dockerfile: backend/Dockerfile
    # Optional: a missing .env is fine. Values below win over it for the keys they set.
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: "true"
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-only}
      DATABASE_URL: sqlite+aiosqlite:////app/data/support.db
      CHECKPOINT_DB_PATH: /app/data/checkpoints.db
      REDIS_URL: redis://redis:6379/0
      USE_FAKE_REDIS: "false"
      # Model settings come from the host environment or the project's .env (compose substitutes both),
      # defaulting to the offline profile so a machine without a key still comes up. To run on Euron put
      # LLM_PROVIDER=euron, EMBEDDING_PROVIDER=euron and LLM_API_KEY in .env; the key is only ever
      # substituted here, never written. Embeddings change when the provider does: POST /knowledge/reindex.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_MODEL_SMART: ${LLM_MODEL_SMART:-}
      LLM_MODEL_REASONING: ${LLM_MODEL_REASONING:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      # Qdrant is running for later; the default store stays in memory so the demo needs nothing else.
      VECTOR_STORE: memory
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # The browser, not the container, calls the API, so this is the host-published port
        # (localhost:${BACKEND_PORT}), not the Docker service name "backend". It is inlined at build time.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  backend-data:
  redis-data:
  qdrant-storage:
