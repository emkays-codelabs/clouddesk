# CloudDesk local stack: frontend -> backend -> redis, qdrant.
#   docker compose up --build
# Image tags are pinned by tag only: pin by digest before production.
# Secrets come from the environment or an optional .env (git-ignored); nothing secret is written here.
name: clouddesk

services:
  redis:
    image: redis:7-alpine # pin by digest before production
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4 # pin by digest before production
    volumes:
      - qdrant-storage:/qdrant/storage
    # The image has no curl or wget, so probe the port with bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: . # the repo root, so rag/, sample_data/ and database/ are in the context
      dockerfile: backend/Dockerfile
    # Optional: a missing .env is fine. Values below win over it for the keys they set.
    env_file:
      - path: .env
        required: false
    environment:
      DEMO_MODE: "true"
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-only}
      DATABASE_URL: sqlite+aiosqlite:////app/data/support.db
      CHECKPOINT_DB_PATH: /app/data/checkpoints.db
      REDIS_URL: redis://redis:6379/0
      USE_FAKE_REDIS: "false"
      LLM_PROVIDER: fake
      # Qdrant is running for later; the default store stays in memory so the demo needs nothing else.
      VECTOR_STORE: memory
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - backend-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # The browser, not the container, calls the API, so this is the host-published port
        # (localhost:8000), not the Docker service name "backend". It is inlined at build time.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  backend-data:
  redis-data:
  qdrant-storage:
